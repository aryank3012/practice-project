<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo-Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="heading">
            <h1>Photo Gallery</h1>
        </div>

        <div class="enterNum">
            <p>Enter the number of photos</p>
        </div>

        <div class="number">
            <input class="input" type="number" placeholder="00" max="10" min="1">
        </div>

        <div class="getImg">
            <button>Get Photos</button>
        </div>
    </div>
    <script src="practice.js"></script>
</body>

</html>
