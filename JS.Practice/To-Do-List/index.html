<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="board">
            <div class="heading">
                <h1>TO-DO-LIST</h1>
            </div>

            <div class="quote">
                <p>"If you spend too much time thinking about a thing, you'll never get it done."</p>
            </div>

            <div class="addBtn">
                <button id="addOn">+</button>
            </div>

            <div class="innerBoard">
                <div class="tasks">
                    <input id="task" type="text" placeholder="Enter your Task....">
                    <button id="remove">X</button>
                </div>

                <ul id="taskList"></ul>
                <button id="clear">Clear</button>
            </div>
        </div>
    </div>
    </div>
    <script src="practice.js"></script>
</body>

</html>
