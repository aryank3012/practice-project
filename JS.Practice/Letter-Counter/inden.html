<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter-Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="board">
        <div class="head">
            <h1 class="heading">Real-time Charater Counter</h1>
        </div>

        <textarea class="writtenText" maxlength="50" placeholder="Please write your text here..."></textarea>

        <p>Total Characters: <span class="charCount">0</span></p>
        <p>Remaining: <span class="charMinus">50</span></p>
    </div>
    </div>
</body>
<script src="practice.js"></script>

</html>
