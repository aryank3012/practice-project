<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Percetage Calculator</title>
</head>

<body>
    <div class="container">
        <div class="board">
            <h1 class="heading">Percentage Calculator</h1>
            <div class="boardOne">
                <h2 class="heading">Percentage of number</h2>
                <div class="box">
                    <p class="problem">What is <input id="numOne" type="number" class="percentage" /> % of <input
                            id="numTwo" type="number" class="num" /> ?</p>
                    <button class="resultBtn" id="btnOne">Calculate</button>
                    <div class="result">
                        <p class="answer" id="ansOne">Result!</p>
                    </div>
                </div>
            </div>

            <div class="boardOne">
                <h2 class="heading">Number of Percentage</h2>
                <div class="box">
                    <p class="problem"> <input id="numThree" type="number" class="percentage" /> is what % of <input
                            id="numFour" type="number" class="num" /> ?</p>
                    <button class="resultBtn" id="btnTwo">Calculate</button>
                    <div class="result">
                        <p class="answer" id="ansTwo">Result!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="practice.js"></script>
</body>

</html>
