<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password-Genrator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="board">
        <div class="heading">
            <h1>Random Password Genrator</h1>
        </div>
        <div class="genratorBox">
            <input type="text" class="password" placeholder="Create Password" readonly>
            <button class="btn" id="genrate">Genrate</button>
            <button class="btn" id="reset">Reset</button>
            <button class="btn" id="copy">Copy</button>

        </div>
    </div>
    <script src="practice.js"></script>
</body>

</html>
