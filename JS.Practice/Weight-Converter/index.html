<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight-Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <div class="board">
            <div class="heading">
                <h1>Weight Converter....</h1>
            </div>

            <div class="input">
                <p>Pounds: <input id="inputNumber" type="number" placeholder="Enter Number"></p>
            </div>

            <div class="valueKG">
                <p>Your weight in kg is: <span id="kilogram">00</span></p>
            </div>

            <div class="resetBtn">
                <button id="reset">Reset</button>
            </div>
        </div>
    </section>
</body>

<script src="practice.js"></script>

</html>
