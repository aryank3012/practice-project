<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideBar Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bars">
        <p class="slideBar">Slideing Bar</p>
    </div>

    <div class="menu">
        <div class="cancel">
            <button class="cross">X</button>
        </div>
        <div class="menuTxt">
            <p class="txt" id="home">Home</p>
            <p class="txt" id="about">About</p>
            <p class="txt" id="contact">Contact</p>
        </div>
    </div>
</body>
<script src="practice.js"></script>

</html>
